<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#B45000"/>
  <!-- Mortar lines -->
  <line x1="0" y1="16" x2="64" y2="16" stroke="#D89060" stroke-width="2"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="#D89060" stroke-width="2"/>
  <line x1="0" y1="48" x2="64" y2="48" stroke="#D89060" stroke-width="2"/>
  <!-- Vertical mortar (offset pattern) -->
  <line x1="32" y1="0" x2="32" y2="16" stroke="#D89060" stroke-width="2"/>
  <line x1="16" y1="16" x2="16" y2="32" stroke="#D89060" stroke-width="2"/>
  <line x1="48" y1="16" x2="48" y2="32" stroke="#D89060" stroke-width="2"/>
  <line x1="32" y1="32" x2="32" y2="48" stroke="#D89060" stroke-width="2"/>
  <line x1="16" y1="48" x2="16" y2="64" stroke="#D89060" stroke-width="2"/>
  <line x1="48" y1="48" x2="48" y2="64" stroke="#D89060" stroke-width="2"/>
  <!-- Highlight -->
  <rect width="64" height="2" fill="#D89060"/>
</svg>
