<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 256 192">
  <!-- Tile spritesheet: 4 columns x 3 rows, 64px per tile -->

  <!-- Index 0: Floor (tan/beige) -->
  <g transform="translate(0,0)">
    <rect width="64" height="64" fill="#c8a86e"/>
    <rect x="2" y="2" width="60" height="60" fill="#d4b87a"/>
    <line x1="32" y1="0" x2="32" y2="64" stroke="#c8a86e" stroke-width="0.5"/>
    <line x1="0" y1="32" x2="64" y2="32" stroke="#c8a86e" stroke-width="0.5"/>
  </g>

  <!-- Index 1: Wall (dark gray stone) -->
  <g transform="translate(64,0)">
    <rect width="64" height="64" fill="#3a3a3a"/>
    <rect x="2" y="2" width="28" height="28" fill="#4a4a4a" rx="1"/>
    <rect x="34" y="2" width="28" height="28" fill="#505050" rx="1"/>
    <rect x="2" y="34" width="28" height="28" fill="#505050" rx="1"/>
    <rect x="34" y="34" width="28" height="28" fill="#4a4a4a" rx="1"/>
    <rect x="4" y="4" width="24" height="24" fill="#5a5a5a" rx="1"/>
    <rect x="36" y="4" width="24" height="24" fill="#606060" rx="1"/>
    <rect x="4" y="36" width="24" height="24" fill="#606060" rx="1"/>
    <rect x="36" y="36" width="24" height="24" fill="#5a5a5a" rx="1"/>
  </g>

  <!-- Index 2: Water frame 1 (blue waves) -->
  <g transform="translate(128,0)">
    <rect width="64" height="64" fill="#2266aa"/>
    <path d="M0,16 Q8,10 16,16 Q24,22 32,16 Q40,10 48,16 Q56,22 64,16" fill="none" stroke="#4499dd" stroke-width="2"/>
    <path d="M0,32 Q8,26 16,32 Q24,38 32,32 Q40,26 48,32 Q56,38 64,32" fill="none" stroke="#4499dd" stroke-width="2"/>
    <path d="M0,48 Q8,42 16,48 Q24,54 32,48 Q40,42 48,48 Q56,54 64,48" fill="none" stroke="#4499dd" stroke-width="2"/>
  </g>

  <!-- Index 3: Water frame 2 (alternate waves) -->
  <g transform="translate(192,0)">
    <rect width="64" height="64" fill="#2266aa"/>
    <path d="M0,16 Q8,22 16,16 Q24,10 32,16 Q40,22 48,16 Q56,10 64,16" fill="none" stroke="#4499dd" stroke-width="2"/>
    <path d="M0,32 Q8,38 16,32 Q24,26 32,32 Q40,38 48,32 Q56,26 64,32" fill="none" stroke="#4499dd" stroke-width="2"/>
    <path d="M0,48 Q8,54 16,48 Q24,42 32,48 Q40,54 48,48 Q56,42 64,48" fill="none" stroke="#4499dd" stroke-width="2"/>
  </g>

  <!-- Index 4: Door (brown) -->
  <g transform="translate(0,64)">
    <rect width="64" height="64" fill="#3a3a3a"/>
    <rect x="8" y="4" width="48" height="56" fill="#6b4226" rx="3"/>
    <rect x="12" y="8" width="40" height="48" fill="#8b5e3c" rx="2"/>
    <circle cx="44" cy="34" r="3" fill="#d4a843"/>
    <line x1="32" y1="8" x2="32" y2="56" stroke="#6b4226" stroke-width="2"/>
  </g>

  <!-- Index 5: Pushblock (dark stone, distinct from wall) -->
  <g transform="translate(64,64)">
    <rect width="64" height="64" fill="#2a2a2a"/>
    <rect x="4" y="4" width="56" height="56" fill="#484860" rx="2"/>
    <rect x="8" y="8" width="48" height="48" fill="#585878" rx="1"/>
    <line x1="16" y1="8" x2="16" y2="56" stroke="#484860" stroke-width="1"/>
    <line x1="32" y1="8" x2="32" y2="56" stroke="#484860" stroke-width="1"/>
    <line x1="48" y1="8" x2="48" y2="56" stroke="#484860" stroke-width="1"/>
    <line x1="8" y1="24" x2="56" y2="24" stroke="#484860" stroke-width="1"/>
    <line x1="8" y1="40" x2="56" y2="40" stroke="#484860" stroke-width="1"/>
  </g>

  <!-- Index 6: Stairs (going down) -->
  <g transform="translate(128,64)">
    <rect width="64" height="64" fill="#1a1a1a"/>
    <rect x="4" y="4" width="56" height="10" fill="#4a4a4a"/>
    <rect x="4" y="16" width="56" height="10" fill="#3a3a3a"/>
    <rect x="4" y="28" width="56" height="10" fill="#2a2a2a"/>
    <rect x="4" y="40" width="56" height="10" fill="#1a1a1a"/>
    <rect x="4" y="52" width="56" height="10" fill="#101010"/>
  </g>

  <!-- Index 7: Bombable wall -->
  <g transform="translate(192,64)">
    <rect width="64" height="64" fill="#2a2a2a"/>
    <rect x="2" y="2" width="60" height="60" fill="#333333" rx="1"/>
  </g>

  <!-- Index 8: Closed door (locked/shuttered - brown door with iron bars) -->
  <g transform="translate(0,128)">
    <rect width="64" height="64" fill="#3a3a3a"/>
    <rect x="8" y="4" width="48" height="56" fill="#4a2a12" rx="3"/>
    <rect x="12" y="8" width="40" height="48" fill="#5a3a20" rx="2"/>
    <line x1="32" y1="8" x2="32" y2="56" stroke="#4a2a12" stroke-width="2"/>
    <rect x="10" y="18" width="44" height="5" fill="#666666" rx="1"/>
    <rect x="10" y="38" width="44" height="5" fill="#666666" rx="1"/>
    <circle cx="16" cy="20.5" r="2" fill="#888888"/>
    <circle cx="48" cy="20.5" r="2" fill="#888888"/>
    <circle cx="16" cy="40.5" r="2" fill="#888888"/>
    <circle cx="48" cy="40.5" r="2" fill="#888888"/>
  </g>

  <!-- Index 9: Dock (wooden planks over water) -->
  <g transform="translate(64,128)">
    <rect width="64" height="64" fill="#2266aa"/>
    <path d="M0,18 Q8,12 16,18 Q24,24 32,18 Q40,12 48,18 Q56,24 64,18" fill="none" stroke="#4499dd" stroke-width="2"/>
    <path d="M0,45 Q8,39 16,45 Q24,51 32,45 Q40,39 48,45 Q56,51 64,45" fill="none" stroke="#4499dd" stroke-width="2"/>
    <rect x="10" y="8" width="12" height="48" fill="#7a5631" rx="2"/>
    <rect x="26" y="8" width="12" height="48" fill="#8a6238" rx="2"/>
    <rect x="42" y="8" width="12" height="48" fill="#7a5631" rx="2"/>
    <rect x="7" y="15" width="50" height="6" fill="#5e3f22" rx="1"/>
    <rect x="7" y="42" width="50" height="6" fill="#5e3f22" rx="1"/>
    <line x1="16" y1="11" x2="16" y2="53" stroke="#b0834b" stroke-width="1"/>
    <line x1="32" y1="11" x2="32" y2="53" stroke="#c09050" stroke-width="1"/>
    <line x1="48" y1="11" x2="48" y2="53" stroke="#b0834b" stroke-width="1"/>
  </g>
</svg>
