<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128">
  <!-- Snake spritesheet: 4 cols x 2 rows, 64px grid -->

  <!-- Row 0: Snake patrol (S, N, E, W) -->
  <!-- South -->
  <rect x="20" y="20" width="24" height="40" rx="8" fill="#cc3333"/>
  <circle cx="27" cy="30" r="3" fill="#ffff00"/>
  <circle cx="37" cy="30" r="3" fill="#ffff00"/>
  <path d="M26 60 L32 68 L38 60" fill="none" stroke="#aa2222" stroke-width="2"/>
  <!-- North -->
  <rect x="84" y="20" width="24" height="40" rx="8" fill="#cc3333"/>
  <circle cx="91" cy="42" r="3" fill="#ffff00"/>
  <circle cx="101" cy="42" r="3" fill="#ffff00"/>
  <!-- East -->
  <rect x="144" y="24" width="40" height="24" rx="8" fill="#cc3333"/>
  <circle cx="176" cy="33" r="3" fill="#ffff00"/>
  <circle cx="176" cy="39" r="3" fill="#ffff00"/>
  <path d="M184 34 L192 36 L184 38" fill="none" stroke="#aa2222" stroke-width="2"/>
  <!-- West -->
  <rect x="208" y="24" width="40" height="24" rx="8" fill="#cc3333"/>
  <circle cx="216" cy="33" r="3" fill="#ffff00"/>
  <circle cx="216" cy="39" r="3" fill="#ffff00"/>
  <path d="M208 34 L200 36 L208 38" fill="none" stroke="#aa2222" stroke-width="2"/>

  <!-- Row 1: Snake charge (S, N, E, W) - elongated -->
  <!-- South charge -->
  <rect x="20" y="80" width="24" height="48" rx="6" fill="#ff4444"/>
  <circle cx="27" cy="90" r="3" fill="#ffff00"/>
  <circle cx="37" cy="90" r="3" fill="#ffff00"/>
  <path d="M26 128 L32 136 L38 128" fill="none" stroke="#cc2222" stroke-width="3"/>
  <!-- North charge -->
  <rect x="84" y="80" width="24" height="48" rx="6" fill="#ff4444"/>
  <circle cx="91" cy="114" r="3" fill="#ffff00"/>
  <circle cx="101" cy="114" r="3" fill="#ffff00"/>
  <!-- East charge -->
  <rect x="136" y="88" width="48" height="24" rx="6" fill="#ff4444"/>
  <circle cx="176" cy="97" r="3" fill="#ffff00"/>
  <circle cx="176" cy="103" r="3" fill="#ffff00"/>
  <path d="M184 98 L194 100 L184 102" fill="none" stroke="#cc2222" stroke-width="3"/>
  <!-- West charge -->
  <rect x="200" y="88" width="48" height="24" rx="6" fill="#ff4444"/>
  <circle cx="208" cy="97" r="3" fill="#ffff00"/>
  <circle cx="208" cy="103" r="3" fill="#ffff00"/>
  <path d="M200 98 L190 100 L200 102" fill="none" stroke="#cc2222" stroke-width="3"/>
</svg>
